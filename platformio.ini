; MAZ Pocket — firmware for M5Stack Cardputer ADV (StampS3A / ESP32-S3FN8)
[platformio]
default_envs = cardputer-adv
src_dir = src

[env:cardputer-adv]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_flags = --no-stub
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DMAZ_POCKET_VERSION=\"0.5\"
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.26
    ricmoo/QRCode@0.0.1
    bblanchon/ArduinoJson@7.2.1

; MAZ Pocket is a Launcher-managed app image. Generic ArduinoOTA remains off:
; v0.5 keeps update ownership in M5Launcher while putting Wi-Fi provisioning,
; MAZ Core, live screen and normal device control directly in MAZ Pocket.
