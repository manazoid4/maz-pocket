; MAZ Pocket — firmware for M5Stack Cardputer ADV (StampS3A / ESP32-S3FN8)
[platformio]
default_envs = cardputer-adv
src_dir = src

[env:cardputer-adv]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; The ESP32-S3's native USB drops its CDC link the moment esptool's stub takes
; over, so cable flashing must use the ROM transport directly.
upload_flags = --no-stub
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DMAZ_POCKET_VERSION=\"0.3.0\"
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_MEM_SIZE=65536U
    -DLV_USE_LOG=0
    -DLV_FONT_MONTSERRAT_10=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_20=1
    -std=gnu++17
build_unflags = -std=gnu++11

; M5Unified 0.2.19 is the first registry build carrying board_M5CardputerADV
; (ES8311 speaker/mic callbacks + ADV SD/I2C pin table). Pinned exactly.
lib_deps =
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.26
    ricmoo/QRCode@0.0.1
    bblanchon/ArduinoJson@7.2.1
    lvgl/lvgl@9.5.0

; Deliberately no generic espota upload environment. Under M5Launcher there can
; be many OTA app slots, and ArduinoOTA's generic "next partition" selection can
; overwrite a sibling firmware. mazpocket.local uses src/net/safe_ota.cpp and
; will update only a proven Maz-owned partner slot; otherwise it reports USB ONLY.
