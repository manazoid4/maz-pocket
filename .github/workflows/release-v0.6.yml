name: Publish MAZ Pocket v0.6

on:
  push:
    branches: [main]
    paths:
      - ".release/v0.6"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content .\VERSION -Raw).Trim()
          if ($v -ne '0.6') { throw "release-v0.6 workflow received VERSION=$v" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install platformio pytest
          pip install -r host/requirements.txt
          pip install "click>=8.0.4,<8.4"

      - name: Test MAZ Core + Host
        run: python -m pytest host/tests -q

      - name: Validate release contract
        run: python scripts/check-version.py

      - name: Validate PowerShell installers parse
        shell: pwsh
        run: |
          $files = @(
            '.\scripts\install-to-sd.ps1',
            '.\scripts\setup-all.ps1',
            '.\scripts\prepare-release.ps1',
            '.\host\setup.ps1',
            '.\host\install-core.ps1',
            '.\host\pair.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; throw "$file has parse errors" }
          }

      - name: Keep recovery flasher tests green
        shell: pwsh
        run: |
          node --check web-flasher/flasher.js
          node --check web-flasher/partition.js
          node --check web-flasher/rom.js
          node web-flasher/test-partition.mjs
          node web-flasher/test-rom.mjs

      - name: Build firmware
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Prepare release assets
        shell: pwsh
        run: ./scripts/prepare-release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$env:VERSION" `
            ".\dist\Maz-Pocket-v$env:VERSION-M5Launcher.bin" `
            ".\dist\MAZ-Core-v$env:VERSION.zip" `
            ".\dist\MAZ-Pocket-v$env:VERSION-Install.zip" `
            .\dist\START-HERE.cmd `
            .\dist\setup-all.ps1 `
            .\dist\INSTALL-MAZ-POCKET.cmd `
            .\dist\install-to-sd.ps1 `
            .\dist\VERSION `
            .\dist\SHA256SUMS.txt `
            .\dist\QUICKSTART.txt `
            .\dist\RELEASE_NOTES.md `
            --target "$env:GITHUB_SHA" `
            --title "MAZ Pocket v$env:VERSION" `
            --notes-file .\RELEASE_NOTES.md `
            --latest
