name: Publish MAZ Pocket v0.4

on:
  push:
    branches: [main]
    paths:
      - ".release/v0.4"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install platformio pytest
          pip install -r host/requirements.txt
          pip install "click>=8.0.4,<8.4"

      - name: Test host
        run: python -m pytest host/tests -q

      - name: Build firmware
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Prepare release assets
        shell: pwsh
        run: |
          $src = '.\dist\maz-pocket-app.bin'
          $dst = '.\dist\Maz-Pocket-v0.4-M5Launcher.bin'
          $b = [IO.File]::ReadAllBytes($src)
          if ($b.Length -lt 65536 -or $b[0] -ne 0xE9) { throw 'invalid ESP32 app image' }
          if ($b.Length -gt 0x180000) { throw "firmware exceeds known Launcher slot: $($b.Length)" }
          Copy-Item $src $dst -Force
          $sha = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Maz-Pocket-v0.4-M5Launcher.bin" | Set-Content -Encoding ascii .\dist\SHA256SUMS.txt
          Copy-Item .\QUICKSTART.txt .\dist\QUICKSTART.txt -Force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4 `
            .\dist\Maz-Pocket-v0.4-M5Launcher.bin `
            .\dist\SHA256SUMS.txt `
            .\dist\QUICKSTART.txt `
            --target "$env:GITHUB_SHA" `
            --title "MAZ Pocket v0.4" `
            --notes-file .\RELEASE_NOTES.md `
            --latest
