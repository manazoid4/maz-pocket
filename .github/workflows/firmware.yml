name: Maz Pocket v0.3

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maz-pocket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host/requirements.txt

      - name: Install build and host dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install platformio pytest pyinstaller
          pip install -r host/requirements.txt

      - name: Test MAZ Host
        run: python -m pytest host/tests -q

      - name: Check updater Python
        run: python -m py_compile updater/ota.py updater/maz_updater.py

      - name: Build Cardputer ADV firmware
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Build Windows updater
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name MazPocketUpdater `
            --paths updater `
            --add-data "dist/maz-pocket-app.bin;firmware" `
            --collect-all esptool `
            --hidden-import serial.tools.list_ports_windows `
            updater/maz_updater.py
          Copy-Item .\dist\MazPocketUpdater.exe .\dist\MazPocketUpdater-v0.3.exe -Force

      - name: Show artifact sizes
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name,Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: maz-pocket-v0.3-windows
          if-no-files-found: error
          path: |
            dist/maz-pocket-app.bin
            dist/MazPocketUpdater-v0.3.exe
