name: Maz Pocket v0.3

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maz-pocket-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host/requirements.txt

      - name: Install build and host dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install platformio pytest pyinstaller
          pip install -r host/requirements.txt
          pip install "click>=8.0.4,<8.4"

      - name: Test MAZ Host and updater planner
        run: python -m pytest host/tests updater/tests -q

      - name: Check updater Python
        run: python -m py_compile updater/flash_plan.py updater/maz_updater.py updater/pyi_streams.py

      - name: Build Cardputer ADV firmware
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Validate packaged ESP32 app image
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from updater.flash_plan import Partition,validate_firmware; b=Path('dist/maz-pocket-app.bin').read_bytes(); validate_firmware(b, Partition(0,0x10,0x10000,0x300000,'CI')); print('firmware validator OK',len(b))"

      - name: Build Windows safe updater
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name MazPocketUpdater `
            --paths updater `
            --runtime-hook updater/pyi_streams.py `
            --add-data "dist/maz-pocket-app.bin;firmware" `
            --collect-all esptool `
            --hidden-import serial.tools.list_ports_windows `
            updater/maz_updater.py
          Copy-Item .\dist\MazPocketUpdater.exe .\dist\MazPocketUpdater-v0.3.exe -Force
          Copy-Item .\QUICKSTART.txt .\dist\QUICKSTART.txt -Force

      - name: Show artifact sizes
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name,Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: maz-pocket-v0.3-windows
          if-no-files-found: error
          path: |
            dist/maz-pocket-app.bin
            dist/MazPocketUpdater-v0.3.exe
            dist/QUICKSTART.txt
