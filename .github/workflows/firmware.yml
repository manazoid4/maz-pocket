name: MAZ Pocket build

on:
  push:
    branches: [main, "release/**", "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maz-pocket-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install platformio pytest
          pip install -r host/requirements.txt
          pip install "click>=8.0.4,<8.4"

      - name: Test MAZ Core + Host
        run: python -m pytest host/tests -q

      - name: Verify generated action IDs
        run: python scripts/gen_action_ids.py --check

      - name: Enforce async Host boundary
        run: python scripts/check_async_contract.py

      - name: Enforce release safety policy
        run: python scripts/release_guard.py

      - name: Syntax-check Python surfaces
        shell: pwsh
        run: |
          python -m compileall -q host/mazhost scripts

      - name: Build Cardputer ADV firmware
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Validate M5Launcher app image
        shell: pwsh
        run: |
          python -c "from pathlib import Path; b=Path('dist/maz-pocket-app.bin').read_bytes(); assert len(b)>=65536 and b[0]==0xE9, 'invalid ESP32 app image'; assert len(b)<=0x180000, f'{len(b)} exceeds known Launcher slot'; print('ESP app image OK',len(b),'bytes / slot',0x180000,'spare',0x180000-len(b))"

      - name: Fetch and verify released v0.5 Launcher rollback
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .\dist\rollback | Out-Null
          gh release download v0.5 --repo $env:GITHUB_REPOSITORY --pattern "Maz-Pocket-v0.5-M5Launcher.bin" --dir .\dist\rollback
          $rollback = ".\dist\rollback\Maz-Pocket-v0.5-M5Launcher.bin"
          $sha = (Get-FileHash $rollback -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "44172a99b69061159b208d222667c070f6305ee02337b5c8562fec25934d1cb0") { throw "v0.5 rollback hash mismatch: $sha" }
          if ((Get-Item $rollback).Length -ne 1367312) { throw "v0.5 rollback size mismatch" }
          Write-Host "Rollback verified: $sha"

      - name: Prepare v0.5.1 install package
        shell: pwsh
        run: |
          Copy-Item .\dist\maz-pocket-app.bin .\dist\Maz-Pocket-v0.5.1-M5Launcher.bin -Force
          Copy-Item .\dist\rollback\Maz-Pocket-v0.5-M5Launcher.bin .\dist\ROLLBACK-v0.5-M5Launcher.bin -Force
          Compress-Archive -Path .\host\* -DestinationPath .\dist\MAZ-Core-v0.5.1.zip -Force
          $firmwareSha = (Get-FileHash .\dist\Maz-Pocket-v0.5.1-M5Launcher.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          $rollbackSha = (Get-FileHash .\dist\ROLLBACK-v0.5-M5Launcher.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          $coreSha = (Get-FileHash .\dist\MAZ-Core-v0.5.1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$firmwareSha  Maz-Pocket-v0.5.1-M5Launcher.bin",
            "$rollbackSha  ROLLBACK-v0.5-M5Launcher.bin",
            "$coreSha  MAZ-Core-v0.5.1.zip"
          ) | Set-Content -Encoding ascii .\dist\SHA256SUMS.txt
          Copy-Item .\QUICKSTART.txt .\dist\QUICKSTART.txt -Force
          Copy-Item .\RELEASE_NOTES.md .\dist\RELEASE_NOTES.md -Force
          if (Test-Path .\THIRD_PARTY_NOTICES.md) { Copy-Item .\THIRD_PARTY_NOTICES.md .\dist\THIRD_PARTY_NOTICES.md -Force }
          Get-ChildItem .\dist\Maz-Pocket-v0.5.1-M5Launcher.bin, .\dist\ROLLBACK-v0.5-M5Launcher.bin, .\dist\MAZ-Core-v0.5.1.zip, .\dist\SHA256SUMS.txt | Select-Object Name,Length
          Get-Content .\dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: maz-pocket-v0.5.1
          if-no-files-found: error
          path: |
            dist/Maz-Pocket-v0.5.1-M5Launcher.bin
            dist/ROLLBACK-v0.5-M5Launcher.bin
            dist/MAZ-Core-v0.5.1.zip
            dist/SHA256SUMS.txt
            dist/QUICKSTART.txt
            dist/RELEASE_NOTES.md
            dist/THIRD_PARTY_NOTICES.md
