name: Maz Pocket v0.03

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maz-pocket-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host/requirements.txt

      - name: Install build and host dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install platformio pytest
          pip install -r host/requirements.txt
          pip install "click>=8.0.4,<8.4"

      - name: Test MAZ Host
        run: python -m pytest host/tests -q

      - name: Test ROM-only browser flasher safety logic
        shell: pwsh
        run: |
          node --check web-flasher/flasher.js
          node --check web-flasher/partition.js
          node --check web-flasher/rom.js
          node web-flasher/test-partition.mjs
          node web-flasher/test-rom.mjs

      - name: Build Cardputer ADV firmware
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Validate app image and physical v0.02 slot fit
        shell: pwsh
        run: |
          python -c "from pathlib import Path; b=Path('dist/maz-pocket-app.bin').read_bytes(); assert len(b)>=65536 and b[0]==0xE9, 'invalid ESP32 app image'; assert len(b)<=0x180000, f'{len(b)} exceeds v0.02 Launcher slot'; print('ESP image OK',len(b),'bytes')"

      - name: Build phone-first web flasher package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Out = Join-Path $PWD 'dist\web-flasher'
          $Fw = Join-Path $Out 'firmware'
          New-Item -ItemType Directory -Force $Fw | Out-Null
          Copy-Item .\web-flasher\index.html (Join-Path $Out 'index.html') -Force
          Copy-Item .\web-flasher\flasher.js (Join-Path $Out 'flasher.js') -Force
          Copy-Item .\web-flasher\partition.js (Join-Path $Out 'partition.js') -Force
          Copy-Item .\web-flasher\rom.js (Join-Path $Out 'rom.js') -Force
          Copy-Item .\dist\maz-pocket-app.bin (Join-Path $Fw 'maz-pocket-app.bin') -Force

          gh release download v0.2.0-hardware-preview.4 --pattern maz-pocket-app.bin --dir $Fw --clobber
          Move-Item (Join-Path $Fw 'maz-pocket-app.bin') (Join-Path $Fw 'maz-pocket-v0.02-recovery.bin') -Force
          Copy-Item .\dist\maz-pocket-app.bin (Join-Path $Fw 'maz-pocket-app.bin') -Force

          $Recovery = Join-Path $Fw 'maz-pocket-v0.02-recovery.bin'
          $RecoverySha = (Get-FileHash $Recovery -Algorithm SHA256).Hash.ToLowerInvariant()
          $RecoveryMd5 = (Get-FileHash $Recovery -Algorithm MD5).Hash.ToLowerInvariant()
          $ExpectedRecoverySha = '2d1eaf0495eceadf0c87d613cca4b9f2819e3ff26ed20584e5bf4d649443f9ed'
          if ($RecoverySha -ne $ExpectedRecoverySha) { throw "v0.02 recovery SHA mismatch: $RecoverySha" }
          $RecoverySize = (Get-Item $Recovery).Length
          if ($RecoverySize -ne 1525984) { throw "Unexpected v0.02 recovery size: $RecoverySize" }

          $Current = Join-Path $Fw 'maz-pocket-app.bin'
          $CurrentSha = (Get-FileHash $Current -Algorithm SHA256).Hash.ToLowerInvariant()
          $CurrentMd5 = (Get-FileHash $Current -Algorithm MD5).Hash.ToLowerInvariant()
          $CurrentSize = (Get-Item $Current).Length
          $Manifest = [ordered]@{
            product = 'MAZ Pocket'
            version = '0.3.0'
            file = 'maz-pocket-app.bin'
            size = $CurrentSize
            sha256 = $CurrentSha
            md5 = $CurrentMd5
            recovery_file = 'maz-pocket-v0.02-recovery.bin'
            recovery_size = $RecoverySize
            recovery_sha256 = $RecoverySha
            recovery_md5 = $RecoveryMd5
            launcher_slot_size = 0x180000
            updater = 'esptool-js@0.6.0-rom-only'
          }
          $Manifest | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $Fw 'manifest.json')
          Copy-Item .\QUICKSTART.txt .\dist\QUICKSTART.txt -Force

      - name: Show packaged sizes and hashes
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File | Select-Object FullName,Length | Format-Table -AutoSize
          Get-FileHash .\dist\maz-pocket-app.bin -Algorithm SHA256
          Get-FileHash .\dist\maz-pocket-app.bin -Algorithm MD5

      - uses: actions/upload-artifact@v4
        with:
          name: maz-pocket-v0.03-phone-first
          if-no-files-found: error
          path: |
            dist/maz-pocket-app.bin
            dist/QUICKSTART.txt
            dist/web-flasher/**
