name: Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio esptool
      - shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: maz-pocket-firmware
          path: dist/*.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flash

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
