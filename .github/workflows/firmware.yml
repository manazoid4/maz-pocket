name: MAZ Pocket build

on:
  push:
    branches: [main, "release/**", "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maz-pocket-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install platformio pytest
          pip install -r host/requirements.txt
          pip install "click>=8.0.4,<8.4"

      - name: Test MAZ Host
        run: python -m pytest host/tests -q

      - name: Keep recovery flasher safety tests green
        shell: pwsh
        run: |
          node --check web-flasher/flasher.js
          node --check web-flasher/partition.js
          node --check web-flasher/rom.js
          node web-flasher/test-partition.mjs
          node web-flasher/test-rom.mjs

      - name: Build Cardputer ADV firmware
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Validate M5Launcher app image
        shell: pwsh
        run: |
          python -c "from pathlib import Path; b=Path('dist/maz-pocket-app.bin').read_bytes(); assert len(b)>=65536 and b[0]==0xE9, 'invalid ESP32 app image'; assert len(b)<=0x180000, f'{len(b)} exceeds known Launcher slot'; print('ESP image OK',len(b),'bytes')"

      - name: Prepare v0.4 SD-install package
        shell: pwsh
        run: |
          Copy-Item .\dist\maz-pocket-app.bin .\dist\Maz-Pocket-v0.4-M5Launcher.bin -Force
          $sha = (Get-FileHash .\dist\Maz-Pocket-v0.4-M5Launcher.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Maz-Pocket-v0.4-M5Launcher.bin" | Set-Content -Encoding ascii .\dist\SHA256SUMS.txt
          Copy-Item .\QUICKSTART.txt .\dist\QUICKSTART.txt -Force
          Copy-Item .\RELEASE_NOTES.md .\dist\RELEASE_NOTES.md -Force
          Get-ChildItem .\dist\Maz-Pocket-v0.4-M5Launcher.bin, .\dist\SHA256SUMS.txt | Select-Object Name,Length
          Get-Content .\dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: maz-pocket-v0.4
          if-no-files-found: error
          path: |
            dist/Maz-Pocket-v0.4-M5Launcher.bin
            dist/SHA256SUMS.txt
            dist/QUICKSTART.txt
            dist/RELEASE_NOTES.md
