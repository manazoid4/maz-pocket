name: MAZ Pocket build

on:
  push:
    branches: [main, "release/**", "agent/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maz-pocket-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install platformio pytest
          pip install -r host/requirements.txt
          pip install "click>=8.0.4,<8.4"

      - name: Test MAZ Core + Host
        run: python -m pytest host/tests -q

      - name: Validate PowerShell installers parse
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\install-to-sd.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; throw 'install-to-sd.ps1 has parse errors' }
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\host\install-core.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; throw 'install-core.ps1 has parse errors' }

      - name: Keep recovery flasher safety tests green
        shell: pwsh
        run: |
          node --check web-flasher/flasher.js
          node --check web-flasher/partition.js
          node --check web-flasher/rom.js
          node web-flasher/test-partition.mjs
          node web-flasher/test-rom.mjs

      - name: Build Cardputer ADV firmware
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Validate M5Launcher app image
        shell: pwsh
        run: |
          python -c "from pathlib import Path; b=Path('dist/maz-pocket-app.bin').read_bytes(); assert len(b)>=65536 and b[0]==0xE9, 'invalid ESP32 app image'; assert len(b)<=0x180000, f'{len(b)} exceeds known Launcher slot'; print('ESP image OK',len(b),'bytes')"

      - name: Prepare v0.5 frictionless install package
        shell: pwsh
        run: |
          Copy-Item .\dist\maz-pocket-app.bin .\dist\Maz-Pocket-v0.5-M5Launcher.bin -Force
          Compress-Archive -Path .\host\* -DestinationPath .\dist\MAZ-Core-v0.5.zip -Force
          Copy-Item .\scripts\install-to-sd.ps1 .\dist\install-to-sd.ps1 -Force
          Copy-Item .\scripts\INSTALL-MAZ-POCKET.cmd .\dist\INSTALL-MAZ-POCKET.cmd -Force
          Copy-Item .\QUICKSTART.txt .\dist\QUICKSTART.txt -Force
          Copy-Item .\RELEASE_NOTES.md .\dist\RELEASE_NOTES.md -Force

          $firmwareSha = (Get-FileHash .\dist\Maz-Pocket-v0.5-M5Launcher.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          $coreSha = (Get-FileHash .\dist\MAZ-Core-v0.5.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSha = (Get-FileHash .\dist\install-to-sd.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $launcherSha = (Get-FileHash .\dist\INSTALL-MAZ-POCKET.cmd -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$firmwareSha  Maz-Pocket-v0.5-M5Launcher.bin",
            "$coreSha  MAZ-Core-v0.5.zip",
            "$installerSha  install-to-sd.ps1",
            "$launcherSha  INSTALL-MAZ-POCKET.cmd"
          ) | Set-Content -Encoding ascii .\dist\SHA256SUMS.txt

          New-Item -ItemType Directory -Path .\dist\install -Force | Out-Null
          $installFiles = @(
            '.\dist\Maz-Pocket-v0.5-M5Launcher.bin',
            '.\dist\MAZ-Core-v0.5.zip',
            '.\dist\install-to-sd.ps1',
            '.\dist\INSTALL-MAZ-POCKET.cmd',
            '.\dist\SHA256SUMS.txt',
            '.\dist\QUICKSTART.txt',
            '.\dist\RELEASE_NOTES.md'
          )
          Copy-Item -Path $installFiles -Destination .\dist\install\ -Force
          Compress-Archive -Path .\dist\install\* -DestinationPath .\dist\MAZ-Pocket-v0.5-Install.zip -Force

          Get-ChildItem .\dist\Maz-Pocket-v0.5-M5Launcher.bin, .\dist\MAZ-Core-v0.5.zip, .\dist\MAZ-Pocket-v0.5-Install.zip, .\dist\SHA256SUMS.txt | Select-Object Name,Length
          Get-Content .\dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: maz-pocket-v0.5
          if-no-files-found: error
          path: |
            dist/Maz-Pocket-v0.5-M5Launcher.bin
            dist/MAZ-Core-v0.5.zip
            dist/MAZ-Pocket-v0.5-Install.zip
            dist/INSTALL-MAZ-POCKET.cmd
            dist/install-to-sd.ps1
            dist/SHA256SUMS.txt
            dist/QUICKSTART.txt
            dist/RELEASE_NOTES.md
