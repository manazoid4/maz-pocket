<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">MAZ Pocket connection chain</title>
  <desc id="desc">Human input travels through a Cardputer and Wi-Fi to MAZ Core, then to local or cloud AI and returns as a result on the Cardputer.</desc>
  <rect width="1400" height="500" rx="28" fill="#0b0f14"/>
  <text x="70" y="72" fill="#f5f7fa" font-family="Arial, sans-serif" font-size="34" font-weight="700">MAZ POCKET / THE CONNECTION</text>
  <text x="70" y="110" fill="#8e9aaa" font-family="Arial, sans-serif" font-size="20">Human intent leaves the pocket, gains PC-scale compute, and returns to the same handheld.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(70 175)">
      <rect width="190" height="150" rx="18" fill="#161d26" stroke="#54e1ff" stroke-width="3"/>
      <text x="95" y="58" fill="#54e1ff" font-size="18" font-weight="700">HUMAN</text>
      <text x="95" y="91" fill="#f5f7fa" font-size="16">voice / keyboard</text>
    </g>
    <g transform="translate(300 175)">
      <rect width="220" height="150" rx="18" fill="#161d26" stroke="#ffd166" stroke-width="3"/>
      <text x="110" y="52" fill="#ffd166" font-size="18" font-weight="700">CARDPUTER ADV</text>
      <text x="110" y="84" fill="#f5f7fa" font-size="16">ESP32-S3 handheld</text>
      <text x="110" y="112" fill="#8e9aaa" font-size="15">capture + confirmation</text>
    </g>
    <g transform="translate(560 175)">
      <rect width="160" height="150" rx="18" fill="#161d26" stroke="#9bdb4d" stroke-width="3"/>
      <text x="80" y="58" fill="#9bdb4d" font-size="18" font-weight="700">WI-FI</text>
      <text x="80" y="91" fill="#f5f7fa" font-size="16">local network</text>
    </g>
    <g transform="translate(760 175)">
      <rect width="220" height="150" rx="18" fill="#161d26" stroke="#ff7a90" stroke-width="3"/>
      <text x="110" y="52" fill="#ff7a90" font-size="18" font-weight="700">MAZ CORE / PC</text>
      <text x="110" y="84" fill="#f5f7fa" font-size="16">STT + routing + files</text>
      <text x="110" y="112" fill="#8e9aaa" font-size="15">bounded actions</text>
    </g>
    <g transform="translate(1020 175)">
      <rect width="310" height="150" rx="18" fill="#161d26" stroke="#b69cff" stroke-width="3"/>
      <text x="155" y="46" fill="#b69cff" font-size="18" font-weight="700">LOCAL OR CLOUD AI</text>
      <text x="155" y="78" fill="#f5f7fa" font-size="16">answer / plan / proposal</text>
      <text x="155" y="108" fill="#8e9aaa" font-size="15">agent evidence when available</text>
    </g>
  </g>
  <g fill="none" stroke="#f5f7fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 250h20m-12-10 12 10-12 10"/>
    <path d="M530 250h20m-12-10 12 10-12 10"/>
    <path d="M730 250h20m-12-10 12 10-12 10"/>
    <path d="M990 250h20m-12-10 12 10-12 10"/>
    <path d="M1175 350v42H410v-42" stroke="#54e1ff"/>
    <path d="M398 362l12-12 12 12" stroke="#54e1ff"/>
  </g>
  <text x="792" y="430" fill="#54e1ff" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="700">RESULT RETURNS TO THE CARDPUTER</text>
</svg>
